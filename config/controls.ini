# Reasignacion de botones del port (se lee al iniciar el juego).
# Botones de PSP: cross circle square triangle l r start select
# Quita el # de una linea para cambiarla. Ejemplos con los valores por defecto:
[keyboard]
#cross=Z
#circle=X
#square=A
#triangle=S
#l=Q
#r=W
#start=ENTER
#select=BACKSPACE
[xbox]
#cross=B
#circle=A
#square=X
#triangle=Y
#l=LB
#r=RB
#start=MENU
#select=VIEW
[playstation]
#cross=CROSS
#circle=CIRCLE
#square=SQUARE
#triangle=TRIANGLE
#l=L1
#r=R1
#start=OPTIONS
#select=SHARE
[nintendo]
#cross=B
#circle=A
#square=Y
#triangle=X
#l=L
#r=R
#start=PLUS
#select=MINUS
[generic]
#cross=2
#circle=3
#square=1
#triangle=4
#l=5
#r=6
#start=10
#select=9
